name: Pull / push to main checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check . --output-format=github

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check .

  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unitTests, integrationTests, webappTests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '.github/workflows/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Arelle web cache
        uses: actions/cache@v6
        with:
          path: ~/.config/arelle/cache
          key: ${{ runner.os }}-arelle-${{ hashFiles('src/mireport/data/taxonomies/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-arelle-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pytest-github-actions-annotate-failures

      - name: Run ${{ matrix.suite }}
        run: pytest tests/${{ matrix.suite }} -n auto --dist worksteal --durations=20 --tb=short --color=yes
        env:
          PYTEST_GITHUB_ACTIONS_ANNOTATE: "true"
