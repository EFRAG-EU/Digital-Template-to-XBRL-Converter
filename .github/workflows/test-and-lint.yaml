name: Pull / push to main checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: Ruff Lint and Format Check
    # Skip draft PRs; pushes to main have no pull_request, so they always run
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check . --output-format=github

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check .

  test:
    name: Tests (${{ matrix.suite }})
    # Skip draft PRs; pushes to main have no pull_request, so they always run
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unitTests
            args: tests/unitTests
          - suite: integrationTests
            args: tests/integrationTests
          - suite: webappTests
            args: tests/webappTests --ignore=tests/webappTests/browser
          # Chromium against the served app: a job of its own, off the
          # runners busy with the other suites' conversions.
          - suite: browserTests
            args: tests/webappTests/browser
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '.github/workflows/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pytest-github-actions-annotate-failures

      - name: Install Chromium for the browser tests
        if: matrix.suite == 'browserTests'
        run: python -m playwright install --with-deps chromium

      - name: Run ${{ matrix.suite }}
        run: pytest ${{ matrix.args }} -n auto --dist loadgroup --durations=20 --tb=short --color=yes
        env:
          PYTEST_GITHUB_ACTIONS_ANNOTATE: "true"
